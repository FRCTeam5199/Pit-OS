<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Schedule</title>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
  <style>
    @font-face {
    font-family: eurostile;
    src: url('5199-fonts/Eurostile-Extended-2-Regular.otf') format('opentype');
    font-weight: normal;
    }
    @font-face {
    font-family: eurostile;
    src: url('5199-fonts/Eurostile-Extended-2-Bold.otf') format('opentype');
    font-weight: bold;
    }

    body{
      background-color: #003366;
      font-family: eurostile;
    }

    .table-custom {
      --bs-table-bg: transparent !important;
      --bs-table-color: #ffffff;
    }

    td.redColWin {
    background: #FF0000 !important;
    color: white;
    }
    td.redColLose {
    background: #cf0000 !important;
    color: #dddddd;
    }

    td.blueColWin {
    background: #0032ff !important;
    color: white;
    }
    td.blueColLose {
    background: #0000df !important;
    color: #dddddd;
    }

    td.winCol {
    background: #ffffff;
    }
    td.loseCol {
    background: #cccccc
    }

  </style>
</head>
<body>
  <table class="table table-custom text-center">
    <thead>
    <tr>
      <th scope="col">Match Number</th>
      <th scope="col">Time</th>
      <th scope="col">Red Alliance</th>
      <th scope="col">Red Score</th>
      <th scope="col">Blue Score</th>
      <th scope="col">Blue Alliance</th>
    </tr>
    </thead>
    <tbody>
<!--      <tr th:each="match:${matches}">-->
<!--        <td th:text="${match.match_number}"></td>-->
<!--    </tr>-->
    <tr th:each="match:${MatchRows}">
      <td th:text="${match.matchName}" style="width: 10%"></td>
      <td th:text="${match.time}"></td>
      <span th:if="${match.winner == 'red'}">
        <td class="winCol">
          <span th:each="team:${match.redAlliance}">&nbsp
            <span th:style="|font-weight: ${team.fontWeight}; color: ${team.color};|" th:text="${team.text}"></span>
          </span>
        </td>
      </span>
      <span th:unless="${match.winner == 'red'}">
        <td class="loseCol">
          <span th:each="team:${match.redAlliance}">&nbsp
            <span th:style="|font-weight: ${team.fontWeight}; color: ${team.color};|" th:text="${team.text}"></span>
          </span>
        </td>
      </span>


<!--      <td th:if="${match.winner == 'red'}"><span class="redColWin" th:text="${match.redScore}"></span>-->
<!--      <td th:unless="${match.winner == 'red'}"><span class="redColLose border" th:text="${match.redScore}"></span>-->

      <a th:if="${match.winner == 'red'}"><td class="redColWin border" th:text="${match.redScore}"></td></a>
      <a th:unless="${match.winner == 'red'}"><td class="redColLose border" th:text="${match.redScore}"></td></a>

      <a th:if="${match.winner == 'blue'}"><td class="blueColWin border" th:text="${match.blueScore}"></td></a>
      <a th:unless="${match.winner == 'blue'}"><td class="blueColLose border" th:text="${match.blueScore}"></td></a>

      <span th:if="${match.winner == 'blue'}">
        <td class="winCol">
          <span th:each="team:${match.blueAlliance}">&nbsp
            <span th:style="|font-weight: ${team.fontWeight}; color: ${team.color};|" th:text="${team.text}"></span>
          </span>
        </td>
      </span>
      <span th:unless="${match.winner == 'blue'}">
        <td class="loseCol">
          <span th:each="team:${match.blueAlliance}">&nbsp
            <span th:style="|font-weight: ${team.fontWeight}; color: ${team.color};|" th:text="${team.text}"></span>
          </span>
        </td>
      </span>
    </tr>
    </tbody>
  </table>
</body>
<footer>
  <span th:style="'font-weight: bold; color:#ff4444; display:' + (${connected}? 'none' : 'inline')">NO INTERNET CONNECTION!</span>
</footer>
</html>
