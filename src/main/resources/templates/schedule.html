<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Schedule</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
            crossorigin="anonymous"></script>
    <link rel="stylesheet" href="styledpage.css">
</head>
<body>
<h1 style="color: #ffffff;">5199 Match Schedule</h1>
<table class="table table-custom text-center">
    <thead class="sticky-top bgCol">
    <tr>
        <th scope="col">Match Number</th>
        <th scope="col">Time</th>
        <th scope="col">Red Alliance</th>
        <th scope="col">Red Score</th>
        <th scope="col">Blue Score</th>
        <th scope="col">Blue Alliance</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="match:${MatchRows}">
        <td th:text="${match.matchName}" style="width: 10%"></td>
        <td th:text="${match.time}"></td>
        <span th:if="${match.winner == 'red'}">
        <td class="winCol">
          <span th:each="team:${match.redAlliance}">&nbsp
            <span th:style="|font-weight: ${team.fontWeight}; color: ${team.color};|" th:text="${team.text}"></span>
          </span>
        </td>
      </span>
        <span th:unless="${match.winner == 'red'}">
        <td class="loseCol">
          <span th:each="team:${match.redAlliance}">&nbsp
            <span th:style="|font-weight: ${team.fontWeight}; color: ${team.color};|" th:text="${team.text}"></span>
          </span>
        </td>
      </span>

        <a th:if="${match.winner == 'red'}">
            <td class="redColWin border" th:text="${match.redScore}"></td>
        </a>
        <a th:unless="${match.winner == 'red'}">
            <td class="redColLose border" th:text="${match.redScore}"></td>
        </a>

        <a th:if="${match.winner == 'blue'}">
            <td class="blueColWin border" th:text="${match.blueScore}"></td>
        </a>
        <a th:unless="${match.winner == 'blue'}">
            <td class="blueColLose border" th:text="${match.blueScore}"></td>
        </a>

        <span th:if="${match.winner == 'blue'}">
        <td class="winCol">
          <span th:each="team:${match.blueAlliance}">&nbsp
            <span th:style="|font-weight: ${team.fontWeight}; color: ${team.color};|" th:text="${team.text}"></span>
          </span>
        </td>
      </span>
        <span th:unless="${match.winner == 'blue'}">
        <td class="loseCol">
          <span th:each="team:${match.blueAlliance}">&nbsp
            <span th:style="|font-weight: ${team.fontWeight}; color: ${team.color};|" th:text="${team.text}"></span>
          </span>
        </td>
      </span>
    </tr>
    </tbody>
</table>
</body>
<footer>
    <span th:style="'font-weight: bold; color:#ff4444; display:' + (${connected}? 'none' : 'inline')">NO INTERNET CONNECTION!</span>
</footer>
</html>
