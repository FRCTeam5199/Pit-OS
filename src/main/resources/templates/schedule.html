<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Schedule</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
            crossorigin="anonymous"></script>
    <link rel="stylesheet" href="styledpage.css">
    <style>
        .schedule-layout {
            display: flex;
            align-items: flex-start;
        }
        .schedule-table-col {
            flex: 1;
            min-width: 0;
            overflow-x: auto;
        }
        .carousel-col {
            width: 240px;
            min-width: 240px;
            position: sticky;
            top: 48px;
            height: calc(100vh - 48px);
            padding: 8px 8px 8px 4px;
            display: flex;
            align-items: center;
        }
        .scroll-container {
            width: 100%;
            height: calc(100vh - 80px);
            border-radius: 10px;
            overflow: hidden;
            background-color: #001a33;
        }
        .scroll-track {
            display: flex;
            flex-direction: column;
            gap: 6px;
            animation: scroll-up 90s linear infinite;
        }
        .scroll-track img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 6px;
            flex-shrink: 0;
        }
        @keyframes scroll-up {
            0%   { transform: translateY(0); }
            100% { transform: translateY(-50%); }
        }
    </style>
</head>
<body>
<div class="heading-block">
    <div style="display: inline-block; width: 48px; height: 48px;">
        <a href="/">
          <img src="favicon.ico" style="width: 48px;" alt="5199 logo">
        </a>
    </div>
    <h1 style="color: #ffffff;"
        class="centered" th:text="|${configuration.teamNumber}'s ${eventName} Match Schedule|">
    </h1>
    <a href="settings" class="btn btn-secondary btn-lg position-absolute top-0 end-0"><img src="settings.png" height="25" alt="settings logo"></a>
</div>
<div class="schedule-layout">
    <div class="schedule-table-col">
        <table class="table table-custom text-center">
            <thead class="sticky-top bgCol">
            <tr>
                <th scope="col">Match Number</th>
                <th scope="col">Time</th>
                <th scope="col">Red Alliance</th>
                <th scope="col">Red Score</th>
                <th scope="col">Blue Score</th>
                <th scope="col">Blue Alliance</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="match:${MatchRows}">
                <td th:text="${match.matchName}" style="width: 10%"></td>
                <td th:text="${match.time}"></td>
                <span th:if="${match.winner == 'red'}">
                <td class="winCol">
                  <span th:each="team:${match.redAlliance}">&nbsp
                    <span th:style="|font-weight: ${team.fontWeight}; color: ${team.color};|" th:text="${team.text}"></span>
                  </span>
                </td>
              </span>
                <span th:unless="${match.winner == 'red'}">
                <td class="loseCol">
                  <span th:each="team:${match.redAlliance}">&nbsp
                    <span th:style="|font-weight: ${team.fontWeight}; color: ${team.color};|" th:text="${team.text}"></span>
                  </span>
                </td>
              </span>

                <a th:if="${match.winner == 'red'}">
                    <td class="redColWin border" th:text="${match.redScore}"></td>
                </a>
                <a th:unless="${match.winner == 'red'}">
                    <td class="redColLose border" th:text="${match.redScore}"></td>
                </a>

                <a th:if="${match.winner == 'blue'}">
                    <td class="blueColWin border" th:text="${match.blueScore}"></td>
                </a>
                <a th:unless="${match.winner == 'blue'}">
                    <td class="blueColLose border" th:text="${match.blueScore}"></td>
                </a>

                <span th:if="${match.winner == 'blue'}">
                <td class="winCol">
                  <span th:each="team:${match.blueAlliance}">&nbsp
                    <span th:style="|font-weight: ${team.fontWeight}; color: ${team.color};|" th:text="${team.text}"></span>
                  </span>
                </td>
              </span>
                <span th:unless="${match.winner == 'blue'}">
                <td class="loseCol">
                  <span th:each="team:${match.blueAlliance}">&nbsp
                    <span th:style="|font-weight: ${team.fontWeight}; color: ${team.color};|" th:text="${team.text}"></span>
                  </span>
                </td>
              </span>
            </tr>
            </tbody>
        </table>
        <iframe
                width="500"
                height="300"
                th:if="${webcast.type.name() == 'youtube'}"
                th:src="|https://www.youtube.com/embed/${webcast.channel}?autoplay=1|"
                title="YouTube video player"
                frameborder="0"
                allow="autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin">
        </iframe>
        <iframe
                th:if="${webcast.type.name() == 'twitch'}"
                th:src="|https://player.twitch.tv/?channel=${webcast.channel}&parent=localhost|"
                height="300"
                width="500"
                allowfullscreen>
        </iframe>
    </div>
    <div class="carousel-col">
        <div class="scroll-container">
            <div class="scroll-track"></div>
        </div>
    </div>
</div>
<footer>
    <span th:style="'font-weight: bold; color:#ff4444; display:' + (${connected}? 'none' : 'inline')">NO INTERNET CONNECTION!</span>
</footer>
<script>
    let currentImageList = [];

    function buildCarousel(images) {
        const track = document.querySelector('.scroll-track');
        if (!track || images.length === 0) return;
        const v = Date.now();
        const doubled = [...images, ...images];
        track.innerHTML = doubled.map((src, i) =>
            `<img src="${src}?v=${v}" alt="Photo ${(i % images.length) + 1}">`
        ).join('');
        const duration = Math.max(images.length * 2, 10);
        track.style.animation = 'none';
        void track.offsetHeight;
        track.style.animation = `scroll-up ${duration}s linear infinite`;
    }

    function refreshImages() {
        fetch('/api/images')
            .then(r => r.json())
            .then(images => {
                if (JSON.stringify(images) !== JSON.stringify(currentImageList)) {
                    currentImageList = images;
                    buildCarousel(images);
                }
            })
            .catch(() => console.warn('Could not load image list'));
    }

    refreshImages();
    setInterval(refreshImages, 60000);
</script>
</body>
</html>
